# Render Blueprint — deploys the Express/MongoDB backend as a web service.
# Render dashboard → New → Blueprint → pick this repo. Values marked
# `sync: false` are prompted for on first deploy (never commit them).
services:
  - type: web
    name: marsu-nstp-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nstp_management_system
      - key: API_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: ATTENDANCE_LATE_GRACE_MINUTES
        value: "15"
      - key: ATTENDANCE_CODE_TTL_MINUTES
        value: "15"
      - key: PASSWORD_RESET_CODE_TTL_MINUTES
        value: "30"
      - key: GRADE_WEIGHT_MODULES
        value: "30"
      - key: GRADE_WEIGHT_ACTIVITIES
        value: "40"
      - key: GRADE_WEIGHT_ATTENDANCE
        value: "30"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: MARSU NSTP Portal <no-reply@marsu.edu.ph>
      - key: CRON_SECRET
        generateValue: true
