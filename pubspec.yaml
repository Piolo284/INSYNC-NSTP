name: marsu_nstp_portal
description: "Marinduque State University NSTP Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.2
  file_picker: ^8.1.2
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.2.1
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/marsu_logo.png
