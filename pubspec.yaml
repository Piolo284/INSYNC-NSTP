    - assets/images/rotc_activities/flag_ceremony.jpg
    - assets/images/rotc_activities/physical_fitness.jpg
    - assets/images/rotc_activities/land_navigation.jpg
    - assets/images/rotc_activities/leadership_summit.jpg
    - assets/images/rotc_activities/raati.jpg
